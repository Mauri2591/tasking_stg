name: SAST Semgrep Scan

on:
  push:
    branches: [ "main" ]
  pull_request:

jobs:
  semgrep-scan:
    runs-on: self-hosted
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Instalar Semgrep (si no está instalado)
        run: |
          if ! command -v semgrep &> /dev/null
          then
            pip install semgrep
          fi

      - name: Ejecutar Semgrep CI (escaneo intenso y reduciendo falsos positivos)
        run: |
          semgrep ci \
            --config auto \
            --config p/ci \
            --severity=WARNING \
            --json > semgrep_result.json
        env:
          SEMGREP_TIMEOUT: "0"     # Sin límite de tiempo → escaneo profundo
          SEMGREP_REDUCE_FP: "1"   # Activa heurísticas antipositivos falsos

      - name: Guardar resultados como artifact
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-report
          path: semgrep_result.json
