name: SAST Semgrep Scan

on:
  push:
    branches: [ "main" ]
  pull_request:

jobs:
  semgrep-scan:
    runs-on: self-hosted
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Instalar Semgrep si no está disponible
        run: |
          if ! command -v semgrep &> /dev/null
          then
            pip install semgrep
          fi

      - name: Ejecutar Semgrep (modo CI, reglas de alta calidad, escaneo profundo)
        run: |
          semgrep ci \
            --config auto \
            --config p/ci \
            --json > semgrep_result.json
        env:
          SEMGREP_TIMEOUT: "0"     # escaneo profundo sin límite
          SEMGREP_REDUCE_FP: "1"   # reducir falsos positivos
          SEMGREP_SUPPRESS_ERRORS: "1"  # evita que errores menores rompan el pipeline

      - name: Guardar resultados como artifact
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-report
          path: semgrep_result.json
