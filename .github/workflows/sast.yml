name: SAST Semgrep Scan (Auto con reducción de falsos positivos)

on:
  push:
    branches: [ "main" ]
  pull_request:

jobs:
  semgrep-scan:
    runs-on: self-hosted

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      # Opcional: instalar semgrep si falta
      - name: Instalar Semgrep si no está disponible
        run: |
          if ! command -v semgrep &> /dev/null
          then
            pip install semgrep
          fi

      - name: Ejecutar Semgrep estable (auto + menos falsos positivos)
        run: |
          semgrep scan \
            --config auto \
            --json > semgrep_result.json
        env:
          SEMGREP_REDUCE_FP: "1"
          SEMGREP_DISABLE_DEEP_SEMANTIC: "1"
          SEMGREP_EXIT_CODE: "0"

      - name: Guardar resultados como artifact
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-report
          path: semgrep_result.json
